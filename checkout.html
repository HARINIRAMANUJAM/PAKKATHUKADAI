
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout | Pakkathu Kadai</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f8f4;
      color: #24352a;
      line-height: 1.6;
    }

    header {
      background: #123d27;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      font-size: 25px;
    }

    main {
      max-width: 850px;
      margin: 30px auto;
      padding: 0 16px;
    }

    .panel {
      background: white;
      padding: 25px;
      margin-bottom: 22px;
      border-radius: 12px;
      box-shadow: 0 3px 12px #0000000c;
    }

    h2 {
      color: #167d45;
      margin-bottom: 16px;
      font-size: 21px;
    }

    .item {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      padding: 12px 0;
      border-bottom: 1px solid #e5ece6;
    }

    .item small {
      display: block;
      color: #657368;
    }

    .total {
      display: flex;
      justify-content: space-between;
      font-size: 21px;
      font-weight: bold;
      margin-top: 18px;
    }

    label {
      display: block;
      font-weight: bold;
      margin: 15px 0 6px;
    }

    input, textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd8ce;
      border-radius: 7px;
      font-size: 16px;
      font-family: inherit;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button, .back-link {
      display: inline-block;
      border: none;
      border-radius: 7px;
      padding: 13px 18px;
      background: #167d45;
      color: white;
      font-size: 16px;
      font-weight: bold;
      text-decoration: none;
      cursor: pointer;
      margin-top: 18px;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .back-link {
      background: #e7f2e9;
      color: #167d45;
      margin-left: 8px;
    }

    #message {
      margin-top: 15px;
      font-weight: bold;
      overflow-wrap: anywhere;
    }

    .success {
      color: #167d45;
    }

    .error {
      color: #b42318;
    }

    .empty {
      color: #657368;
      padding: 10px 0;
    }

    @media (max-width: 500px) {
      .panel {
        padding: 18px;
      }

      .back-link {
        margin-left: 0;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>🛍️ Pakkathu Kadai</h1>
    <p>Complete your order</p>
  </header>

  <main>
    <section class="panel">
      <h2>🧺 Order Summary</h2>
      <div id="orderItems">
        <p class="empty">Loading your cart...</p>
      </div>

      <div class="total">
        <span>Total</span>
        <span>₹<span id="orderTotal">0.00</span></span>
      </div>
    </section>

    <section class="panel">
      <h2>📍 Delivery Details</h2>

      <form id="checkoutForm">
        <label for="customerName">Full Name</label>
        <input
          type="text"
          id="customerName"
          required
          maxlength="100"
          autocomplete="name"
          placeholder="Enter your full name"
        >

        <label for="phone">Mobile Number</label>
        <input
          type="tel"
          id="phone"
          required
          inputmode="numeric"
          pattern="[0-9]{10}"
          maxlength="10"
          autocomplete="tel"
          placeholder="10-digit mobile number"
        >

        <label for="address">Delivery Address</label>
        <textarea
          id="address"
          required
          maxlength="1000"
          autocomplete="street-address"
          placeholder="Enter your complete delivery address"
        ></textarea>

        <button type="submit" id="placeOrderButton">
          Place Order
        </button>

        <a href="index.html" class="back-link">
          Back to Shopping
        </a>

        <p id="message" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    "use strict";

    const SUPABASE_URL =
      "https://qjywimxvejnkfbatukut.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_GXCZjh_C8Y-bsq9AwngaAQ_nQziTHu6";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const orderItemsElement =
      document.getElementById("orderItems");

    const orderTotalElement =
      document.getElementById("orderTotal");

    const checkoutForm =
      document.getElementById("checkoutForm");

    const placeOrderButton =
      document.getElementById("placeOrderButton");

    const messageElement =
      document.getElementById("message");

    let checkoutItems = [];
    let total = 0;
    let orderSubmitted = false;

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, function(char) {
        const replacements = {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        };

        return replacements[char];
      });
    }

    function loadCheckout() {
      try {
        const savedCart = JSON.parse(
          sessionStorage.getItem("pakkathuCart") || "{}"
        );

        const savedProducts = JSON.parse(
          sessionStorage.getItem("pakkathuProducts") || "[]"
        );

        if (
          !savedCart ||
          typeof savedCart !== "object" ||
          !Array.isArray(savedProducts)
        ) {
          throw new Error("Invalid cart data.");
        }

        checkoutItems = Object.keys(savedCart)
          .map(function(id) {
            const product = savedProducts.find(function(item) {
              return String(item.id) === String(id);
            });

            const quantity = Number(savedCart[id]);

            if (
              !product ||
              !Number.isInteger(quantity) ||
              quantity <= 0 ||
              !Number.isFinite(Number(product.price))
            ) {
              return null;
            }

            const price = Number(product.price);

            return {
              id: product.id,
              name: product.name,
              shop: product.shop_name || product.shop || "Local Store",
              price: price,
              quantity: quantity,
              subtotal: price * quantity
            };
          })
          .filter(Boolean);

        total = checkoutItems.reduce(function(sum, item) {
          return sum + item.subtotal;
        }, 0);

        renderOrder();
      } catch (error) {
        console.error("Checkout loading error:", error);

        checkoutItems = [];
        total = 0;

        orderItemsElement.innerHTML =
          '<p class="empty">Could not load your cart. Please return to shopping.</p>';

        orderTotalElement.textContent = "0.00";
        placeOrderButton.disabled = true;
      }
    }

    function renderOrder() {
      if (checkoutItems.length === 0) {
        orderItemsElement.innerHTML =
          '<p class="empty">Your cart is empty. Please add products first.</p>';

        orderTotalElement.textContent = "0.00";
        placeOrderButton.disabled = true;
        return;
      }

      orderItemsElement.innerHTML = checkoutItems.map(function(item) {
        return `
          <div class="item">
            <div>
              <strong>${escapeHTML(item.name)}</strong>
              <small>${escapeHTML(item.shop)}</small>
              <small>₹${item.price.toFixed(2)} × ${item.quantity}</small>
            </div>
            <strong>₹${item.subtotal.toFixed(2)}</strong>
          </div>
        `;
      }).join("");

      orderTotalElement.textContent = total.toFixed(2);
      placeOrderButton.disabled = false;
    }

    checkoutForm.addEventListener("submit", async function(event) {
      event.preventDefault();

      if (orderSubmitted || checkoutItems.length === 0) {
        return;
      }

      const customerName =
        document.getElementById("customerName").value.trim();

      const phone =
        document.getElementById("phone").value.trim();

      const address =
        document.getElementById("address").value.trim();

      if (!customerName || !/^[0-9]{10}$/.test(phone) || !address) {
        messageElement.className = "error";
        messageElement.textContent =
          "Please enter your name, a valid 10-digit mobile number, and address.";
        return;
      }

      placeOrderButton.disabled = true;
      messageElement.className = "";
      messageElement.textContent = "Placing your order...";

      try {
        const order = {
          customer_name: customerName,
          phone: phone,
          delivery_address: address,
          items: checkoutItems.map(function(item) {
            return {
              product_id: item.id,
              name: item.name,
              shop: item.shop,
              price: item.price,
              quantity: item.quantity,
              subtotal: item.subtotal
            };
          }),
          total: Number(total.toFixed(2)),
          status: "pending"
        };

        const { data, error } = await supabaseClient
          .from("orders")
          .insert([order])
          .select("id")
          .single();

        if (error) {
          throw error;
        }

        orderSubmitted = true;

        sessionStorage.removeItem("pakkathuCart");
        sessionStorage.removeItem("pakkathuProducts");

        messageElement.className = "success";
        messageElement.textContent =
          "Order placed successfully!" +
          (data && data.id ? " Order ID: " + data.id : "") +
          " Thank you for shopping with Pakkathu Kadai.";

        orderItemsElement.innerHTML =
          '<p class="success">Your order has been recorded.</p>';

        orderTotalElement.textContent = total.toFixed(2);
        checkoutForm.reset();

        placeOrderButton.textContent = "Order Placed";

      } catch (error) {
        console.error("Order submission error:", error);

        messageElement.className = "error";
        messageElement.textContent =
          "Could not place your order. " +
          (error.message || "Please check your Supabase permissions and try again.");

        placeOrderButton.disabled = false;
      }
    });

    loadCheckout();
  </script>
</body>
</html>
