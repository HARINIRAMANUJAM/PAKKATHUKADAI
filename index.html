
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pakkathu Kadai | Local Shopping</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f8f2;
      color: #243124;
    }

    header {
      background: #218838;
      color: white;
      padding: 24px 16px;
      text-align: center;
    }

    header h1 { margin: 0 0 8px; }
    header p { margin: 0; }

    .controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      padding: 16px;
      max-width: 1100px;
      margin: auto;
    }

    input, select {
      padding: 12px;
      border: 1px solid #cbd5c8;
      border-radius: 8px;
      font-size: 15px;
      background: white;
    }

    input { flex: 1; min-width: 180px; }
    select { min-width: 160px; }

    #status {
      text-align: center;
      padding: 12px;
      overflow-wrap: anywhere;
    }

    #products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 16px;
      padding: 16px;
      max-width: 1100px;
      margin: auto;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 18px;
      box-shadow: 0 2px 8px #00000010;
    }

    .card h3 { margin: 0 0 10px; }
    .shop { color: #607060; font-size: 14px; }
    .price { color: #218838; font-size: 18px; font-weight: bold; }

    button {
      border: 0;
      border-radius: 7px;
      padding: 10px 14px;
      cursor: pointer;
      font-size: 15px;
    }

    .add {
      background: #218838;
      color: white;
      width: 100%;
      margin-top: 10px;
    }

    .qty {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      margin-top: 12px;
    }

    .qty button {
      background: #e1f1e3;
      color: #176b2a;
      font-weight: bold;
      min-width: 36px;
    }

    #cart {
      background: white;
      padding: 20px;
      margin: 16px auto;
      max-width: 1068px;
      border-radius: 12px;
      box-shadow: 0 2px 8px #00000010;
    }

    #cart h2 { margin-top: 0; }
    #cartItems { line-height: 2; }
    #total { font-size: 20px; font-weight: bold; color: #218838; }

    #clearCart {
      background: #eeeeee;
      margin-top: 10px;
    }

    footer {
      text-align: center;
      padding: 20px;
      color: #607060;
    }
  </style>
</head>

<body>
  <header>
    <h1>🛍️ Pakkathu Kadai</h1>
    <p>Your neighbourhood shops, all in one place!</p>
  </header>

  <div class="controls">
    <input id="search" type="search" placeholder="Search products...">
    <select id="shopFilter">
      <option value="">All shops</option>
    </select>
  </div>

  <div id="status">Connecting to your local shops...</div>

  <main id="products"></main>

  <section id="cart">
    <h2>🛒 Your Cart</h2>
    <div id="cartItems">Your cart is empty.</div>
    <p id="total">Total: ₹0.00</p>
    <button id="clearCart">Clear Cart</button>
  </section>

  <footer>Shop local. Support local ❤️</footer>

  <script>
    // SUPABASE CONFIGURATION
    const SUPABASE_URL =
      "https://qjywimxvejnkfbatukut.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_GXCZjh_C8Y-bsq9AwngaAQ_nQziTHu6";

    // Keep this equal to the actual table name in Supabase.
    const TABLE_NAME = "Products";

    const statusEl = document.getElementById("status");
    const productsEl = document.getElementById("products");
    const searchEl = document.getElementById("search");
    const shopFilterEl = document.getElementById("shopFilter");
    const cartItemsEl = document.getElementById("cartItems");
    const totalEl = document.getElementById("total");

    let products = [];
    const cart = {};

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, character => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[character]);
    }

    function money(value) {
      return "₹" + Number(value || 0).toFixed(2);
    }

    async function loadProducts() {
      try {
        if (!window.supabase) {
          throw new Error(
            "Supabase library could not load. Check your internet connection."
          );
        }

        const client = window.supabase.createClient(
          SUPABASE_URL,
          SUPABASE_KEY
        );

        const { data, error } = await client
          .from(TABLE_NAME)
          .select("id, name, price, quantity, shop_name, unit")
          .order("name");

        if (error) throw error;

        products = data || [];

        const shops = [
          ...new Set(
            products
              .map(product => product.shop_name)
              .filter(Boolean)
          )
        ].sort();

        shopFilterEl.innerHTML =
          '<option value="">All shops</option>' +
          shops.map(shop =>
            `<option value="${escapeHTML(shop)}">${escapeHTML(shop)}</option>`
          ).join("");

        renderProducts();

        statusEl.textContent = products.length
          ? `Successfully loaded ${products.length} products!`
          : "Connected, but no products were found in the table.";

      } catch (error) {
        console.error("Supabase error:", error);
        statusEl.textContent =
          "Could not load products: " +
          (error.message || "Unknown error");
      }
    }

    function renderProducts() {
      const query = searchEl.value.trim().toLowerCase();
      const selectedShop = shopFilterEl.value;

      const filtered = products.filter(product => {
        const matchesSearch =
          String(product.name || "").toLowerCase().includes(query) ||
          String(product.shop_name || "").toLowerCase().includes(query);

        const matchesShop =
          !selectedShop || product.shop_name === selectedShop;

        return matchesSearch && matchesShop;
      });

      if (!filtered.length) {
        productsEl.innerHTML = "<p>No matching products found.</p>";
        return;
      }

      productsEl.innerHTML = filtered.map(product => {
        const quantity = cart[product.id]?.quantity || 0;

        return `
          <article class="card">
            <h3>${escapeHTML(product.name)}</h3>
            <p class="shop">${escapeHTML(product.shop_name || "Local shop")}</p>
            <p class="price">
              ${money(product.price)} / ${escapeHTML(product.unit || "unit")}
            </p>
            <p>Available: ${escapeHTML(product.quantity ?? "—")}</p>

            ${
              quantity === 0
                ? `<button class="add" data-add="${escapeHTML(product.id)}">
                     Add to Cart
                   </button>`
                : `<div class="qty">
                     <button data-minus="${escapeHTML(product.id)}">−</button>
                     <strong>${quantity}</strong>
                     <button data-plus="${escapeHTML(product.id)}">+</button>
                   </div>`
            }
          </article>
        `;
      }).join("");
    }

    function updateCart() {
      const items = Object.values(cart);

      if (!items.length) {
        cartItemsEl.textContent = "Your cart is empty.";
        totalEl.textContent = "Total: ₹0.00";
        return;
      }

      let total = 0;

      cartItemsEl.innerHTML = items.map(item => {
        const subtotal = Number(item.price || 0) * item.quantity;
        total += subtotal;

        return `
          <div>
            ${escapeHTML(item.name)} × ${item.quantity}
            — ${money(subtotal)}
          </div>
        `;
      }).join("");

      totalEl.textContent = "Total: " + money(total);
    }

    function changeQuantity(id, change) {
      const product = products.find(
        item => String(item.id) === String(id)
      );

      if (!product) return;

      const current = cart[id]?.quantity || 0;
      const next = current + change;
      const available = Number(product.quantity);

      if (
        change > 0 &&
        product.quantity !== null &&
        product.quantity !== undefined &&
        Number.isFinite(available) &&
        next > available
      ) {
        statusEl.textContent =
          `Only ${available} units of ${product.name} are available.`;
        return;
      }

      if (next <= 0) {
        delete cart[id];
      } else {
        cart[id] = {
          id: product.id,
          name: product.name,
          price: product.price,
          quantity: next
        };
      }

      renderProducts();
      updateCart();
    }

    productsEl.addEventListener("click", event => {
      const button = event.target.closest("button");
      if (!button) return;

      if (button.dataset.add !== undefined) {
        changeQuantity(button.dataset.add, 1);
      } else if (button.dataset.plus !== undefined) {
        changeQuantity(button.dataset.plus, 1);
      } else if (button.dataset.minus !== undefined) {
        changeQuantity(button.dataset.minus, -1);
      }
    });

    searchEl.addEventListener("input", renderProducts);
    shopFilterEl.addEventListener("change", renderProducts);

    document.getElementById("clearCart").addEventListener("click", () => {
      Object.keys(cart).forEach(id => delete cart[id]);
      renderProducts();
      updateCart();
    });

    loadProducts();
  </script>
</body>
</html>
