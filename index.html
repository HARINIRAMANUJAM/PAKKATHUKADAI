
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  const SUPABASE_URL =
    "https://qjywimxvejnkfbatukut.supabase.co";

  const SUPABASE_KEY =
    "PASTE_YOUR_ACTUAL_SB_PUBLISHABLE_KEY_HERE";

  const TABLE_NAME = "Products";

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  async function loadProducts() {
    const status = document.getElementById("status");
    const productsBox = document.getElementById("products");

    try {
      status.textContent = "Connecting to Supabase...";

      const { data, error } = await supabaseClient
        .from(TABLE_NAME)
        .select("*");

      if (error) throw error;

      status.textContent =
        "Connected successfully. Products loaded: " + data.length;

      productsBox.replaceChildren();

      data.forEach(product => {
        const card = document.createElement("div");
        card.className = "product";

        const name = document.createElement("h3");
        name.textContent = product.name || "Unnamed product";

        const shop = document.createElement("p");
        shop.textContent = "Shop: " + (product.shop_name || "Local shop");

        const price = document.createElement("p");
        price.textContent = "Price: ₹" + (product.price ?? 0);

        const quantity = document.createElement("p");
        quantity.textContent =
          "Available: " + (product.quantity ?? 0) +
          (product.unit ? " " + product.unit : "");

        card.append(name, shop, price, quantity);
        productsBox.appendChild(card);
      });

    } catch (error) {
      console.error("Supabase error:", error);
      status.textContent = "Could not load products: " + error.message;
      productsBox.textContent = "Please check the table name and SELECT policy.";
    }
  }

  loadProducts();
</script>
